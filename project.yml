name: justchill

options:
  bundleIdPrefix: com.emm
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  CoreDomain:
    path: Packages/CoreDomain
  CoreDatabase:
    path: Packages/CoreDatabase
  CoreUI:
    path: Packages/CoreUI

targets:
  justchill:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CoreDomain
      - package: CoreUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emm.justchill
        PRODUCT_NAME: $(TARGET_NAME)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: JustChill
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

schemes:
  justchill:
    build:
      targets:
        justchill: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: CoreDomain/CoreDomainTests
        - package: CoreDatabase/CoreDatabaseTests
        - package: CoreUI/CoreUITests
    archive:
      config: Release
